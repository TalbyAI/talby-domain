<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contract acceptance seam</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; background: #f5f7fb; color: #172033; }
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 64px; }
    section { margin-top: 22px; padding: 22px; background: #fff; border: 1px solid #dce2ee; border-radius: 12px; }
    h1, h2, h3 { line-height: 1.2; }
    h1 { margin-bottom: 8px; }
    h2 { margin-top: 0; }
    .eyebrow { color: #3457d5; font-weight: 650; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
    .card { padding: 15px; background: #f8faff; border: 1px solid #e2e8f4; border-radius: 9px; }
    button { cursor: pointer; font: inherit; border: 1px solid #b8c4d8; border-radius: 8px; padding: 8px 11px; background: #fff; color: inherit; }
    button:hover, button:focus-visible { border-color: #3457d5; outline: 2px solid #c9d3ff; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 6px; border-bottom: 1px solid #e2e8f4; text-align: left; vertical-align: top; }
    th { color: #526079; font-size: .9rem; }
    pre { overflow: auto; margin: 8px 0 0; padding: 12px; background: #172033; color: #eef3ff; border-radius: 8px; font: 13px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; }
    @media (max-width: 650px) { main { width: min(100% - 20px, 1180px); padding-top: 22px; } section { padding: 16px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Disposable prototype · contract acceptance seam</p>
      <h1>Contract acceptance seam</h1>
      <p id="scope"></p>
    </header>
    <section aria-labelledby="state-title">
      <h2 id="state-title">Current state</h2>
      <div id="state" class="grid"></div>
      <pre id="last-request" aria-label="Last request"></pre>
      <pre id="last-response" aria-label="Last response" aria-live="polite"></pre>
      <pre id="incidents" aria-label="Incidents" aria-live="polite"></pre>
    </section>
    <section aria-labelledby="free-play-title">
      <h2 id="free-play-title">Free exploration</h2>
      <div id="free-play" class="grid"></div>
    </section>
    <section aria-labelledby="walkthrough-title">
      <h2 id="walkthrough-title">Guided walkthroughs</h2>
      <div id="walkthroughs"></div>
    </section>
  </main>
  <script>
    "use strict";
    const ContractAcceptanceProbe = (() => {
      const effectiveModel = {
        route: { value: "/projects", origin: "derivado" },
        operations: ["create", "get", "list", "patch", "delete"],
        fields: {
          importe: { type: "ExactDecimal", origin: "declarado" },
          periodo: { rule: "fin >= inicio", origin: "declarado" }
        },
        profileDefaults: { listLimit: { value: 20, origin: "default" } },
        command: { name: "AprobarProyecto", origin: "declarado" },
        event: { name: "ProjectApproved", origin: "declarado" }
      };
      const fixtures = {
        valid: {
          semanticSource: `@prefix c: <https://github.com/TalbyAI/talby-domain/vocab/contract#> .
@prefix d: <urn:talby:prototype:declaration:> .
d:Project a c:Entity ; c:name "Proyecto" .`,
          mockingSource: `@prefix m: <https://github.com/TalbyAI/talby-domain/vocab/mocking#> .
@prefix s: <urn:talby:prototype:scenario:> .
s:ApproveKnownProject a m:Scenario .`,
          effectiveModel,
          samplePayload: {
            clienteId: "cliente-1",
            nombre: "Proyecto Atlas",
            periodo: { inicio: "2026-01-01", fin: "2026-12-31" },
            importe: "100.00"
          },
          verification: { status: "verified", diagnostics: [] }
        },
        missingReference: { verification: { status: "blocked", diagnostics: [
          { code: "REFERENCE_NOT_FOUND", paths: ["/Proyecto/clienteId"] }
        ] } },
        unsupportedFunction: { verification: { status: "blocked", diagnostics: [
          { code: "FUNCTION_UNSUPPORTED", paths: ["/Proyecto/Periodo"] }
        ] } },
        contradictory: { verification: { status: "blocked", diagnostics: [
          { code: "DECLARATION_CONTRADICTION", paths: ["/Proyecto/importe"] }
        ] } }
      };
      const sourceNotFound = {
        status: "blocked",
        diagnostics: [{ code: "SOURCE_NOT_FOUND", paths: ["/sources"] }]
      };
      const actors = {
        editor: ["projects.read", "projects.write", "projects.approve"],
        reader: ["projects.read"],
        anonymous: []
      };
      const paginationBindings = new Map();
      const walkthroughs = [{
        title: "Source verification check",
        steps: [
          { label: "Load valid sources", action: { type: "loadSources" } },
          { label: "Verify sources", action: { type: "verify" } },
          { label: "Materialize effective model", action: { type: "materialize" } }
        ]
      }, {
        title: "HTTP acceptance check",
        steps: [
          { label: "Load and materialize valid sources", action: { type: "loadSources" } },
          { label: "Verify sources", action: { type: "verify" } },
          { label: "Materialize effective model", action: { type: "materialize" } },
          { label: "Act as editor", action: { type: "selectActor", actor: "editor" } },
          { label: "Create project", action: { type: "request", operation: "create", input: { body: {
            clienteId: "cliente-1", nombre: " Proyecto Atlas ", periodo: { inicio: "2026-01-01", fin: "2026-12-31" }, importe: "100.00"
          } } } },
          { label: "List projects", action: { type: "request", operation: "list", input: {} } },
          { label: "Get project", action: { type: "request", operation: "get", input: { id: "project-1" } } },
          { label: "Patch project", action: { type: "request", operation: "patch", input: { id: "project-1", body: { nombre: " Proyecto Atlas actualizado " } } } },
          { label: "Delete project", action: { type: "request", operation: "delete", input: { id: "project-1" } } },
          { label: "Reject invalid Periodo without changing storage", action: { type: "request", operation: "create", input: { body: {
            clienteId: "cliente-1", nombre: "Rejected", periodo: { inicio: "2026-12-31", fin: "2026-01-01" }, importe: "100.00"
          } } } },
          { label: "Reject unknown field without changing storage", action: { type: "request", operation: "create", input: { body: {
            clienteId: "cliente-1", nombre: "Rejected", importe: "100.00", extra: true
          } } } },
          { label: "Reject invalid identifier without changing storage", action: { type: "request", operation: "get", input: { id: "invalid!" } } },
          { label: "Reject mixed pagination without changing storage", action: { type: "request", operation: "list", input: { query: { offset: 0, token: "opaque-1" } } } },
          { label: "Reject invalid token without changing storage", action: { type: "request", operation: "list", input: { query: { token: "unknown" } } } }
        ]
      }];

      function fixtureFor(source) {
        return Object.hasOwn(fixtures, source) ? fixtures[source] : null;
      }

      function verifySources(fixture) {
        return fixture.verification;
      }

      function materializeEffectiveModel(fixture) {
        if (fixture.verification.status !== "verified") return null;
        return {
          route: { value: "/projects", origin: "derivado" },
          operations: ["create", "get", "list", "patch", "delete"],
          fields: {
            importe: { type: "ExactDecimal", origin: "declarado" },
            periodo: { rule: "fin >= inicio", origin: "declarado" }
          },
          profileDefaults: { listLimit: { value: 20, origin: "default" } },
          command: { name: "AprobarProyecto", origin: "declarado" },
          event: { name: "ProjectApproved", origin: "declarado" }
        };
      }

      function normalizeProject(input) {
        const value = { ...input };
        if (typeof value.nombre === "string") value.nombre = value.nombre.trim();
        return { value, incidents: [] };
      }

      function isIdentifier(value) {
        return typeof value === "string" && /^[A-Za-z0-9_-]{1,128}$/.test(value);
      }

      function pointerSegment(value) {
        return value.replace(/~/g, "~0").replace(/\//g, "~1");
      }

      function validateProject(input, mode = "complete") {
        const incidents = [];
        const known = ["clienteId", "nombre", "periodo", "importe"];
        for (const key of Object.keys(input)) {
          if (!known.includes(key)) incidents.push({ code: "UNKNOWN_FIELD", paths: [`/${pointerSegment(key)}`] });
        }
        if (mode === "complete" && !input.nombre) incidents.push({ code: "REQUIRED", paths: ["/nombre"] });
        if (Object.hasOwn(input, "clienteId") && !isIdentifier(input.clienteId)) incidents.push({ code: "INVALID_IDENTIFIER", paths: ["/clienteId"] });
        if (input.periodo && input.periodo.fin < input.periodo.inicio) incidents.push({
          code: "PERIOD_END_BEFORE_START", paths: ["/periodo/inicio", "/periodo/fin"]
        });
        if ((mode === "complete" || Object.hasOwn(input, "importe")) && typeof input.importe !== "string") incidents.push({ code: "EXACT_DECIMAL_STRING_REQUIRED", paths: ["/importe"] });
        return incidents;
      }

      function problem(status, code, detail, errors = []) {
        return {
          status,
          headers: { "content-type": "application/problem+json" },
          body: {
            type: `https://talby.ai/problems/${code.toLowerCase()}`,
            title: detail,
            status,
            detail,
            instance: "urn:talby:prototype:request:1",
            errors
          }
        };
      }

      function clientRequest(operation, input, state) {
        const routes = {
          create: ["POST", "/projects"],
          get: ["GET", `/projects/${input.id}`],
          list: ["GET", "/projects"],
          patch: ["PATCH", `/projects/${input.id}`],
          delete: ["DELETE", `/projects/${input.id}`],
          approve: ["POST", "/projects/commands/AprobarProyecto"]
        };
        const [method, path] = routes[operation];
        return {
          method,
          path,
          headers: { "X-Test-Actor": state.actor },
          ...(Object.hasOwn(input, "query") ? { query: input.query } : {}),
          ...(Object.hasOwn(input, "body") ? { body: input.body } : {})
        };
      }

      function logicalStorage(state) {
        return {
          adapter: "SQLite (logical adapter)",
          projects: state.projects.map(project => ({ ...project }))
        };
      }

      function response(status, body) {
        return { status, headers: status === 204 ? {} : { "content-type": "application/json" }, body };
      }

      function operationFor(request) {
        if (request.method === "POST" && request.path === "/projects") return "create";
        if (request.method === "GET" && request.path === "/projects") return "list";
        if (request.method === "POST" && request.path === "/projects/commands/AprobarProyecto") return "approve";
        if (/^\/projects\/[^/]+$/.test(request.path)) return ({ GET: "get", PATCH: "patch", DELETE: "delete" })[request.method];
        return null;
      }

      function executeHttp(state, request) {
        const operation = operationFor(request);
        const required = ({ create: ["projects.write"], get: ["projects.read"], list: ["projects.read"], patch: ["projects.write"], delete: ["projects.write"], approve: ["projects.approve"] })[operation] || [];
        const granted = actors[request.headers?.["X-Test-Actor"]] || [];
        const missing = required.filter(permission => !granted.includes(permission));
        const transition = { operation: operation || "unknown", required, granted, missing };
        if (!operation) return { state, response: problem(404, "ROUTE_NOT_FOUND", "Route not found"), transition };
        if (missing.length) return { state, response: problem(403, "FORBIDDEN", "Permission denied"), transition };
        const id = request.path.split("/")[2];
        if (id && !isIdentifier(id)) {
          return { state, response: problem(422, "INVALID_IDENTIFIER", "Identifier is invalid", [{ code: "INVALID_IDENTIFIER", paths: ["/id"] }]), transition };
        }
        if (operation === "create") {
          if (request.body === null) return { state, response: problem(422, "VALIDATION_FAILED", "Project validation failed", [{ code: "NULL_BODY", paths: ["/"] }]), transition };
          const normalized = normalizeProject(request.body === undefined ? {} : request.body);
          const incidents = normalized.incidents.concat(validateProject(normalized.value));
          if (incidents.length) return { state, response: problem(422, "VALIDATION_FAILED", "Project validation failed", incidents), transition };
          const project = { id: `project-${state.projects.length + 1}`, ...normalized.value };
          return { state: { ...state, projects: [...state.projects, project] }, response: response(201, project), transition };
        }
        if (operation === "list") {
          if (request.query === null) return { state, response: problem(400, "INVALID_QUERY", "Query is invalid", [{ code: "NULL_QUERY", paths: ["/query"] }]), transition };
          const query = request.query === undefined ? {} : request.query;
          if (query.offset !== undefined && query.token !== undefined) return { state, response: problem(400, "PAGINATION_MIXED", "Offset and token cannot be combined"), transition };
          const signature = JSON.stringify({ limit: query.limit || 20, filter: query.filter || null });
          let index = Number(query.offset || 0);
          if (query.token !== undefined) {
            const binding = paginationBindings.get(query.token);
            if (!binding) return { state, response: problem(400, "PAGINATION_TOKEN_UNKNOWN", "Continuation token is unknown"), transition };
            if (binding.signature !== signature) return { state, response: problem(400, "PAGINATION_TOKEN_MISMATCH", "Continuation token does not match the query"), transition };
            index = binding.index;
          }
          const limit = Number(query.limit || 20);
          const items = state.projects.slice(index, index + limit).map(project => ({ ...project }));
          const nextIndex = index + items.length;
          const token = nextIndex < state.projects.length ? `opaque-${nextIndex}` : null;
          if (token) paginationBindings.set(token, { signature, index: nextIndex });
          return { state, response: response(200, { items, pagination: { limit, token } }), transition };
        }
        const projectId = operation === "approve" ? request.body?.id : id;
        if (operation === "approve" && !isIdentifier(projectId)) {
          return { state, response: problem(422, "INVALID_IDENTIFIER", "Identifier is invalid", [{ code: "INVALID_IDENTIFIER", paths: ["/id"] }]), transition };
        }
        const index = state.projects.findIndex(project => project.id === projectId);
        if (index < 0) return { state, response: problem(404, "PROJECT_NOT_FOUND", "Project not found"), transition };
        if (operation === "get") return { state, response: response(200, { ...state.projects[index] }), transition };
        if (operation === "delete") return { state: { ...state, projects: state.projects.filter(project => project.id !== projectId) }, response: response(204), transition };
        if (operation === "patch") {
          if (request.body === null) return { state, response: problem(422, "VALIDATION_FAILED", "Project validation failed", [{ code: "NULL_BODY", paths: ["/"] }]), transition };
          const normalized = normalizeProject(request.body === undefined ? {} : request.body);
          const suppliedIncidents = normalized.incidents.concat(validateProject(normalized.value, "partial"));
          const project = { ...state.projects[index], ...normalized.value };
          const { id: ignoredId, ...projectInput } = project;
          const incidents = suppliedIncidents.concat(validateProject(projectInput).filter(incident => incident.code !== "UNKNOWN_FIELD"));
          if (incidents.length) return { state, response: problem(422, "VALIDATION_FAILED", "Project validation failed", incidents), transition };
          const projects = state.projects.map((item, itemIndex) => itemIndex === index ? project : item);
          return { state: { ...state, projects }, response: response(200, project), transition };
        }
        const project = { ...state.projects[index], estado: "approved" };
        const projects = state.projects.map((item, itemIndex) => itemIndex === index ? project : item);
        return { state: { ...state, projects }, response: response(200, project), transition };
      }

      function initialState() {
        return {
          stage: "sources-not-loaded",
          selectedSource: null,
          verification: null,
          effectiveModel: null,
          clientEnabled: false,
          mockEnabled: false,
          storageEnabled: false,
          actor: null,
          // ponytail: in-memory logical storage; real SQLite belongs to implementation acceptance
          projects: []
        };
      }

      function reduce(state, action) {
        if (action.type === "reset") {
          paginationBindings.clear();
          return initialState();
        }
        if (action.type === "loadSources" || action.type === "loadInvalidSource") {
          const selectedSource = action.source || (action.type === "loadSources" ? "valid" : null);
          if (!fixtureFor(selectedSource)) {
            return { ...initialState(), stage: "blocked", selectedSource, verification: sourceNotFound };
          }
          return { ...initialState(), stage: "sources-loaded", selectedSource };
        }
        if (action.type === "verify" && state.selectedSource) {
          const fixture = fixtureFor(state.selectedSource);
          const verification = fixture ? verifySources(fixture) : sourceNotFound;
          return {
            ...state,
            stage: verification.status === "verified" ? "verified" : "blocked",
            verification,
            effectiveModel: null,
            clientEnabled: false,
            mockEnabled: false,
            storageEnabled: false
          };
        }
        if (action.type === "materialize" && state.verification?.status === "verified") {
          return {
            ...state,
            stage: "materialized",
            effectiveModel: materializeEffectiveModel(fixtures[state.selectedSource]),
            clientEnabled: true,
            mockEnabled: true,
            storageEnabled: true
          };
        }
        if (action.type === "selectActor") return { ...state, actor: action.actor };
        return state;
      }

      return { fixtures, walkthroughs, initialState, reduce, normalizeProject, validateProject, clientRequest, executeHttp, logicalStorage };
    })();

    const elements = {
      scope: document.querySelector("#scope"),
      state: document.querySelector("#state"),
      freePlay: document.querySelector("#free-play"),
      walkthroughs: document.querySelector("#walkthroughs"),
      lastRequest: document.querySelector("#last-request"),
      lastResponse: document.querySelector("#last-response"),
      incidents: document.querySelector("#incidents")
    };
    let state = ContractAcceptanceProbe.initialState();
    let lastRequest = null;
    let lastResponse = null;
    let lastTransition = null;

    function card(title, value) {
      const item = document.createElement("article");
      item.className = "card";
      const heading = document.createElement("h3");
      heading.textContent = title;
      const content = document.createElement("pre");
      content.textContent = value;
      item.append(heading, content);
      return item;
    }

    function render(currentState) {
      const fixture = Object.hasOwn(ContractAcceptanceProbe.fixtures, currentState.selectedSource)
        ? ContractAcceptanceProbe.fixtures[currentState.selectedSource]
        : null;
      elements.scope.textContent = "Logical contract-level probe; no parser, runtime, network, or persistence is run.";
      elements.state.replaceChildren(
        card("Stage", currentState.stage),
        card("Selected source", currentState.selectedSource || "none"),
        card("Turtle logical adapter — Semantic Source", fixture?.semanticSource || "not selected; no Turtle parser"),
        card("Turtle logical adapter — Mocking Source", fixture?.mockingSource || "not selected; no Turtle parser"),
        card("Verification logical adapter", currentState.verification
          ? currentState.verification.diagnostics.map(({ code, paths }) => `${code} ${paths.join(", ")}`).join("\n") || currentState.verification.status
          : "not run; no RDF/SHACL verifier"),
        card("Effective model", currentState.effectiveModel ? JSON.stringify(currentState.effectiveModel, null, 2) : "not materialized"),
        card("TypeScript-client logical adapter", `${currentState.clientEnabled ? "unblocked" : "blocked"}; HTTP request boundary`),
        card("HTTP/JSON mock logical adapter", `${currentState.mockEnabled ? "unblocked" : "blocked"}; response and transition`),
        card("SQLite logical adapter", currentState.storageEnabled ? JSON.stringify(ContractAcceptanceProbe.logicalStorage(currentState), null, 2) : "blocked"),
        card("Transition", lastTransition ? JSON.stringify(lastTransition, null, 2) : "no request")
      );
      elements.lastRequest.textContent = lastRequest ? JSON.stringify(lastRequest, null, 2) : "No request";
      elements.lastResponse.textContent = lastResponse ? JSON.stringify(lastResponse, null, 2) : "No response";
      elements.incidents.textContent = lastResponse?.body?.errors?.length ? JSON.stringify(lastResponse.body.errors, null, 2) : "No incidents";
      elements.freePlay.replaceChildren();
      const actions = [
        ["Load valid sources", { type: "loadSources" }],
        ["Load missing reference", { type: "loadInvalidSource", source: "missingReference" }],
        ["Load unsupported function", { type: "loadInvalidSource", source: "unsupportedFunction" }],
        ["Load contradictory declaration", { type: "loadInvalidSource", source: "contradictory" }],
        ["Verify sources", { type: "verify" }],
        ["Materialize effective model", { type: "materialize" }],
        ["Reset", { type: "reset" }]
      ];
      if (currentState.clientEnabled) actions.push(
        ["Act as editor", { type: "selectActor", actor: "editor" }],
        ["Act as reader", { type: "selectActor", actor: "reader" }],
        ["Act as anonymous", { type: "selectActor", actor: "anonymous" }],
        ["Create valid project", { type: "request", operation: "create", input: { body: ContractAcceptanceProbe.fixtures.valid.samplePayload } }],
        ["List projects", { type: "request", operation: "list", input: { query: { limit: 1 } } }],
        ["Get project-1", { type: "request", operation: "get", input: { id: "project-1" } }],
        ["Patch project-1", { type: "request", operation: "patch", input: { id: "project-1", body: { nombre: " Proyecto Atlas actualizado " } } }],
        ["Delete project-1", { type: "request", operation: "delete", input: { id: "project-1" } }],
        ["Invalid Periodo", { type: "request", operation: "create", input: { body: { ...ContractAcceptanceProbe.fixtures.valid.samplePayload, periodo: { inicio: "2026-12-31", fin: "2026-01-01" } } } }],
        ["Unknown field", { type: "request", operation: "create", input: { body: { ...ContractAcceptanceProbe.fixtures.valid.samplePayload, extra: true } } }],
        ["Invalid identifier", { type: "request", operation: "get", input: { id: "invalid!" } }],
        ["Mixed pagination", { type: "request", operation: "list", input: { query: { offset: 0, token: "opaque-1" } } }],
        ["Invalid token", { type: "request", operation: "list", input: { query: { token: "unknown" } } }],
        ["Approve project-1", { type: "request", operation: "approve", input: { body: { id: "project-1" } } }]
      );
      actions.forEach(([label, action]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.disabled = action.type === "materialize" && currentState.verification?.status !== "verified";
        button.addEventListener("click", () => dispatch(action));
        elements.freePlay.append(button);
      });
      elements.walkthroughs.replaceChildren();
      ContractAcceptanceProbe.walkthroughs.forEach((walkthrough) => {
        const item = card(walkthrough.title, walkthrough.steps.map(({ label }, index) => `${index + 1}. ${label}`).join("\n"));
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = walkthrough.title === "Source verification check" ? "Run source verification check (verified)" : "Run HTTP acceptance check";
        button.addEventListener("click", () => {
          const results = [];
          state = walkthrough.steps.reduce((next, { label, action }) => {
            if (action.type !== "request") return ContractAcceptanceProbe.reduce(next, action);
            const request = ContractAcceptanceProbe.clientRequest(action.operation, action.input, next);
            const result = ContractAcceptanceProbe.executeHttp(next, request);
            lastRequest = request;
            lastResponse = result.response;
            results.push({ label, status: result.response.status, projects: ContractAcceptanceProbe.logicalStorage(result.state).projects });
            return result.state;
          }, ContractAcceptanceProbe.initialState());
          lastTransition = results.length ? { walkthrough: results } : null;
          render(state);
        });
        item.append(button);
        elements.walkthroughs.append(item);
      });
    }

    function dispatch(action) {
      if (action.type === "request") {
        if (!state.clientEnabled || !state.mockEnabled || !state.storageEnabled) return;
        lastRequest = ContractAcceptanceProbe.clientRequest(action.operation, action.input, state);
        const result = ContractAcceptanceProbe.executeHttp(state, lastRequest);
        state = result.state;
        lastResponse = result.response;
        lastTransition = result.transition;
        render(state);
        return;
      }
      state = ContractAcceptanceProbe.reduce(state, action);
      if (action.type === "reset") [lastRequest, lastResponse, lastTransition] = [null, null, null];
      render(state);
    }

    render(state);
  </script>
</body>
</html>
