<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contract acceptance seam</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; background: #f5f7fb; color: #172033; }
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 64px; }
    section { margin-top: 22px; padding: 22px; background: #fff; border: 1px solid #dce2ee; border-radius: 12px; }
    h1, h2, h3 { line-height: 1.2; }
    h1 { margin-bottom: 8px; }
    h2 { margin-top: 0; }
    .eyebrow { color: #3457d5; font-weight: 650; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
    .card { padding: 15px; background: #f8faff; border: 1px solid #e2e8f4; border-radius: 9px; }
    button { cursor: pointer; font: inherit; border: 1px solid #b8c4d8; border-radius: 8px; padding: 8px 11px; background: #fff; color: inherit; }
    button:hover, button:focus-visible { border-color: #3457d5; outline: 2px solid #c9d3ff; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 6px; border-bottom: 1px solid #e2e8f4; text-align: left; vertical-align: top; }
    th { color: #526079; font-size: .9rem; }
    pre { overflow: auto; margin: 8px 0 0; padding: 12px; background: #172033; color: #eef3ff; border-radius: 8px; font: 13px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; }
    @media (max-width: 650px) { main { width: min(100% - 20px, 1180px); padding-top: 22px; } section { padding: 16px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Disposable prototype · contract acceptance seam</p>
      <h1>Contract acceptance seam</h1>
      <p id="scope"></p>
    </header>
    <section aria-labelledby="state-title">
      <h2 id="state-title">Current state</h2>
      <div id="state" class="grid"></div>
      <pre id="last-request" aria-label="Last request"></pre>
      <pre id="last-response" aria-label="Last response" aria-live="polite"></pre>
      <pre id="incidents" aria-label="Incidents" aria-live="polite"></pre>
    </section>
    <section aria-labelledby="free-play-title">
      <h2 id="free-play-title">Free exploration</h2>
      <div id="free-play" class="grid"></div>
    </section>
    <section aria-labelledby="walkthrough-title">
      <h2 id="walkthrough-title">Guided walkthroughs</h2>
      <div id="walkthroughs"></div>
    </section>
  </main>
  <script>
    "use strict";
    // Tasks 2–5 add the logical module and renderer.
  </script>
</body>
</html>
