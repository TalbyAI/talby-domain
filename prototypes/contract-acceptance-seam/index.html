<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contract acceptance seam</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; background: #f5f7fb; color: #172033; }
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 64px; }
    section { margin-top: 22px; padding: 22px; background: #fff; border: 1px solid #dce2ee; border-radius: 12px; }
    h1, h2, h3 { line-height: 1.2; }
    h1 { margin-bottom: 8px; }
    h2 { margin-top: 0; }
    .eyebrow { color: #3457d5; font-weight: 650; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
    .card { padding: 15px; background: #f8faff; border: 1px solid #e2e8f4; border-radius: 9px; }
    button { cursor: pointer; font: inherit; border: 1px solid #b8c4d8; border-radius: 8px; padding: 8px 11px; background: #fff; color: inherit; }
    button:hover, button:focus-visible { border-color: #3457d5; outline: 2px solid #c9d3ff; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 6px; border-bottom: 1px solid #e2e8f4; text-align: left; vertical-align: top; }
    th { color: #526079; font-size: .9rem; }
    pre { overflow: auto; margin: 8px 0 0; padding: 12px; background: #172033; color: #eef3ff; border-radius: 8px; font: 13px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; }
    @media (max-width: 650px) { main { width: min(100% - 20px, 1180px); padding-top: 22px; } section { padding: 16px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Disposable prototype · contract acceptance seam</p>
      <h1>Contract acceptance seam</h1>
      <p id="scope"></p>
    </header>
    <section aria-labelledby="state-title">
      <h2 id="state-title">Current state</h2>
      <div id="state" class="grid"></div>
      <pre id="last-request" aria-label="Last request"></pre>
      <pre id="last-response" aria-label="Last response" aria-live="polite"></pre>
      <pre id="incidents" aria-label="Incidents" aria-live="polite"></pre>
    </section>
    <section aria-labelledby="free-play-title">
      <h2 id="free-play-title">Free exploration</h2>
      <div id="free-play" class="grid"></div>
    </section>
    <section aria-labelledby="walkthrough-title">
      <h2 id="walkthrough-title">Guided walkthroughs</h2>
      <div id="walkthroughs"></div>
    </section>
  </main>
  <script>
    "use strict";
    const ContractAcceptanceProbe = (() => {
      const effectiveModel = {
        route: { value: "/projects", origin: "derivado" },
        operations: ["create", "get", "list", "patch", "delete"],
        fields: {
          importe: { type: "ExactDecimal", origin: "declarado" },
          periodo: { rule: "fin >= inicio", origin: "declarado" }
        },
        profileDefaults: { listLimit: { value: 20, origin: "default" } },
        command: { name: "AprobarProyecto", origin: "declarado" },
        event: { name: "ProjectApproved", origin: "declarado" }
      };
      const fixtures = {
        valid: {
          semanticSource: `@prefix c: <https://github.com/TalbyAI/talby-domain/vocab/contract#> .
@prefix d: <urn:talby:prototype:declaration:> .
d:Project a c:Entity ; c:name "Proyecto" .`,
          mockingSource: `@prefix m: <https://github.com/TalbyAI/talby-domain/vocab/mocking#> .
@prefix s: <urn:talby:prototype:scenario:> .
s:ApproveKnownProject a m:Scenario .`,
          effectiveModel,
          samplePayload: {
            clienteId: "cliente-1",
            nombre: "Proyecto Atlas",
            periodo: { inicio: "2026-01-01", fin: "2026-12-31" },
            importe: "100.00"
          },
          verification: { status: "verified", diagnostics: [] }
        },
        missingReference: { verification: { status: "blocked", diagnostics: [
          { code: "REFERENCE_NOT_FOUND", paths: ["/Proyecto/clienteId"] }
        ] } },
        unsupportedFunction: { verification: { status: "blocked", diagnostics: [
          { code: "FUNCTION_UNSUPPORTED", paths: ["/Proyecto/Periodo"] }
        ] } },
        contradictory: { verification: { status: "blocked", diagnostics: [
          { code: "DECLARATION_CONTRADICTION", paths: ["/Proyecto/importe"] }
        ] } }
      };
      const sourceNotFound = {
        status: "blocked",
        diagnostics: [{ code: "SOURCE_NOT_FOUND", paths: ["/sources"] }]
      };
      const walkthroughs = [{
        title: "Source verification check",
        steps: [
          { label: "Load valid sources", action: { type: "loadSources" } },
          { label: "Verify sources", action: { type: "verify" } },
          { label: "Materialize effective model", action: { type: "materialize" } }
        ]
      }];

      function fixtureFor(source) {
        return Object.hasOwn(fixtures, source) ? fixtures[source] : null;
      }

      function verifySources(fixture) {
        return fixture.verification;
      }

      function materializeEffectiveModel(fixture) {
        if (fixture.verification.status !== "verified") return null;
        return {
          route: { value: "/projects", origin: "derivado" },
          operations: ["create", "get", "list", "patch", "delete"],
          fields: {
            importe: { type: "ExactDecimal", origin: "declarado" },
            periodo: { rule: "fin >= inicio", origin: "declarado" }
          },
          profileDefaults: { listLimit: { value: 20, origin: "default" } },
          command: { name: "AprobarProyecto", origin: "declarado" },
          event: { name: "ProjectApproved", origin: "declarado" }
        };
      }

      function initialState() {
        return {
          stage: "sources-not-loaded",
          selectedSource: null,
          verification: null,
          effectiveModel: null,
          clientEnabled: false,
          mockEnabled: false,
          storageEnabled: false,
          actor: null
        };
      }

      function reduce(state, action) {
        if (action.type === "reset") return initialState();
        if (action.type === "loadSources" || action.type === "loadInvalidSource") {
          const selectedSource = action.source || (action.type === "loadSources" ? "valid" : null);
          if (!fixtureFor(selectedSource)) {
            return { ...initialState(), stage: "blocked", selectedSource, verification: sourceNotFound };
          }
          return { ...initialState(), stage: "sources-loaded", selectedSource };
        }
        if (action.type === "verify" && state.selectedSource) {
          const fixture = fixtureFor(state.selectedSource);
          const verification = fixture ? verifySources(fixture) : sourceNotFound;
          return {
            ...state,
            stage: verification.status === "verified" ? "verified" : "blocked",
            verification,
            effectiveModel: null,
            clientEnabled: false,
            mockEnabled: false,
            storageEnabled: false
          };
        }
        if (action.type === "materialize" && state.verification?.status === "verified") {
          return {
            ...state,
            stage: "materialized",
            effectiveModel: materializeEffectiveModel(fixtures[state.selectedSource]),
            clientEnabled: true,
            mockEnabled: true,
            storageEnabled: true
          };
        }
        if (action.type === "selectActor") return { ...state, actor: action.actor };
        return state;
      }

      return { fixtures, walkthroughs, initialState, reduce };
    })();

    const elements = {
      scope: document.querySelector("#scope"),
      state: document.querySelector("#state"),
      freePlay: document.querySelector("#free-play"),
      walkthroughs: document.querySelector("#walkthroughs")
    };
    let state = ContractAcceptanceProbe.initialState();

    function card(title, value) {
      const item = document.createElement("article");
      item.className = "card";
      const heading = document.createElement("h3");
      heading.textContent = title;
      const content = document.createElement("pre");
      content.textContent = value;
      item.append(heading, content);
      return item;
    }

    function render(currentState) {
      const fixture = Object.hasOwn(ContractAcceptanceProbe.fixtures, currentState.selectedSource)
        ? ContractAcceptanceProbe.fixtures[currentState.selectedSource]
        : null;
      elements.scope.textContent = "Logical contract-level probe; no parser, runtime, network, or persistence is run.";
      elements.state.replaceChildren(
        card("Stage", currentState.stage),
        card("Selected source", currentState.selectedSource || "none"),
        card("Turtle logical adapter — Semantic Source", fixture?.semanticSource || "not selected; no Turtle parser"),
        card("Turtle logical adapter — Mocking Source", fixture?.mockingSource || "not selected; no Turtle parser"),
        card("Verification logical adapter", currentState.verification
          ? currentState.verification.diagnostics.map(({ code, paths }) => `${code} ${paths.join(", ")}`).join("\n") || currentState.verification.status
          : "not run; no RDF/SHACL verifier"),
        card("Effective model", currentState.effectiveModel ? JSON.stringify(currentState.effectiveModel, null, 2) : "not materialized"),
        card("TypeScript-client logical adapter", `${currentState.clientEnabled ? "unblocked" : "blocked"}; not implemented in Task 2`),
        card("HTTP/mock logical adapter", `${currentState.mockEnabled ? "unblocked" : "blocked"}; not implemented in Task 2`),
        card("SQLite logical adapter", `${currentState.storageEnabled ? "unblocked" : "blocked"}; not implemented in Task 2`)
      );
      elements.freePlay.replaceChildren();
      [
        ["Load valid sources", { type: "loadSources" }],
        ["Load missing reference", { type: "loadInvalidSource", source: "missingReference" }],
        ["Load unsupported function", { type: "loadInvalidSource", source: "unsupportedFunction" }],
        ["Load contradictory declaration", { type: "loadInvalidSource", source: "contradictory" }],
        ["Verify sources", { type: "verify" }],
        ["Materialize effective model", { type: "materialize" }],
        ["Reset", { type: "reset" }]
      ].forEach(([label, action]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.disabled = action.type === "materialize" && currentState.verification?.status !== "verified";
        button.addEventListener("click", () => dispatch(action));
        elements.freePlay.append(button);
      });
      elements.walkthroughs.replaceChildren();
      ContractAcceptanceProbe.walkthroughs.forEach((walkthrough) => {
        const item = card(walkthrough.title, walkthrough.steps.map(({ label }, index) => `${index + 1}. ${label}`).join("\n"));
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "Run source verification check (verified)";
        button.addEventListener("click", () => {
          state = walkthrough.steps.reduce((next, { action }) => ContractAcceptanceProbe.reduce(next, action), ContractAcceptanceProbe.initialState());
          render(state);
        });
        item.append(button);
        elements.walkthroughs.append(item);
      });
    }

    function dispatch(action) {
      state = ContractAcceptanceProbe.reduce(state, action);
      render(state);
    }

    render(state);
  </script>
</body>
</html>
